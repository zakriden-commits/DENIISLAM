name: Build Deni Islam — APK and web
on:
  push:
    branches: [main, arena/01855df3-deniislam]
  workflow_dispatch:
    inputs:
      server_url:
        description: "HTTPS game server URL (leave empty to use GAME_SERVER_URL repository variable)"
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: deni-islam-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VITE_SERVER_URL: ${{ inputs.server_url || vars.GAME_SERVER_URL || 'https://3000-iwh0asiuilxeqaap6svjf.e2b.app' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check FPS and phone controls in Chromium
        run: npm run test:browser
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FPS-phone-checks
          path: test-results/
          retention-days: 7
      - name: Upload installable iPhone / desktop web app
        uses: actions/upload-artifact@v4
        with:
          name: Deni-Islam-web
          path: dist/
          retention-days: 30
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Use Android SDK preinstalled on the runner
        run: |
          test -d "$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          ls "$ANDROID_HOME/platforms"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Cache test signing key (debug alpha, not Play Store)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: deni-islam-debug-keystore-v1
      - run: npx cap sync android
      - name: Build Android test APK
        run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon
      - name: Prepare downloads
        run: |
          mkdir -p downloads
          cp android/app/build/outputs/apk/debug/app-debug.apk downloads/Deni-Islam-Android-alpha.apk
          (cd dist && zip -r ../downloads/Deni-Islam-iPhone-Web.zip .)
          sha256sum downloads/* > downloads/SHA256SUMS.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Deni-Islam-Android-APK
          path: downloads/
          retention-days: 30
      - name: Publish downloadable alpha
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "alpha-0.2.0-${GITHUB_RUN_NUMBER}" downloads/* \
            --target "$GITHUB_SHA" --prerelease \
            --title "Deni Islam FPS 0.2 — Android alpha #${GITHUB_RUN_NUMBER}" \
            --notes "FPS 0.2: first-person hands and weapons, gritty retro visuals, mobile landscape controls, sensitivity settings, automatic reconnect with 90-second session reservation. Test-signed Android APK and iPhone/desktop PWA web bundle. Server: ${VITE_SERVER_URL}. The e2b.app preview is temporary, not permanent hosting. Both players must use the same server URL in Settings. Minimum Android 6 with an up-to-date WebView supporting WebGL 2. See README for persistent server deployment. This is a playable low-poly prototype, not a finished commercial release."
